# Single source of truth for every robot model in this repository.
#
# Every tool reads this file: scripts/*.py, launch/*.launch.py and
# isaaclab/cps_robots_cfg.py. To add a robot, add an entry here,
# put the files under robots/<name>/ and run scripts/build_assets.py + scripts/validate.py.
#
#   urdf        canonical URDF (package:// mesh URIs), relative to repo root
#   fixed_base  true for arms bolted to a table, false for mobile robots / legged robots
#   mesh_search mesh folders searched (in order) when normalising legacy mesh paths
#   defaults    values injected where the legacy URDF had none / zero (flagged in the report)
#   usd         Isaac Sim USD (generated by isaaclab/convert_all.sh); legacy_usd = old hand-made USD
#   isaac_builtin  use Isaac Lab's own config instead of our USD (e.g. Go2)
#   mujoco_alt  well-tuned upstream MJCF you may prefer for serious work
#   camera      screenshot framing shared by all simulators: view from +x+y, 25 deg above
#   init_joints optional {joint-name regex: position} start pose (MuJoCo / Isaac screenshots)

package: cps_robot_description

robots:
  go2:
    description: Unitree Go2 quadruped
    camera: {distance: 1.6, target_z: 0.25}   # screenshot framing
    urdf: robots/go2/urdf/go2.urdf
    fixed_base: false
    spawn_z: 0.45
    init_joints: {'.*_hip_joint': 0.0, '.*_thigh_joint': 0.8, '.*_calf_joint': -1.5}  # standing pose
    mesh_search: [go2]
    defaults: {effort: 23.7, velocity: 30.1, link_mass: 0.1}
    usd: robots/go2/usd/go2.usd
    isaac_builtin: isaaclab_assets.robots.unitree.UNITREE_GO2_CFG
    mujoco_alt: https://github.com/google-deepmind/mujoco_menagerie/tree/main/unitree_go2
    source: https://github.com/unitreerobotics/unitree_ros/tree/master/robots/go2_description

  myagv:
    description: Elephant Robotics myAGV mobile base (visual-only shell, no wheels modelled)
    camera: {distance: 1.0, target_z: 0.1}   # screenshot framing
    urdf: robots/myagv/urdf/myagv.urdf
    fixed_base: false
    spawn_z: 0.01
    mesh_search: [myagv]
    defaults: {effort: 10.0, velocity: 2.0, link_mass: 1.8}
    usd: robots/myagv/usd/myagv.usd
    legacy_usd: robots/myagv/usd/legacy/myAGV.usd
    source: https://www.elephantrobotics.com/

  mycobot_280_pi:
    description: Elephant Robotics myCobot 280 Pi with camera flange + suction pump
    camera: {distance: 0.9, target_z: 0.2}   # screenshot framing
    urdf: robots/mycobot_280_pi/urdf/mycobot_280_pi_with_camera_flange_pump.urdf
    variants:
      - robots/mycobot_280_pi/urdf/mycobot_280_pi.urdf
      - robots/mycobot_280_pi/urdf/mycobot_280_pi_with_camera_flange.urdf
      - robots/mycobot_280_pi/urdf/mycobot_280_pi_with_pump.urdf
    fixed_base: true
    mesh_search: [mycobot_280_pi, mycobot_280_gripper]
    defaults: {effort: 5.0, velocity: 2.0, link_mass: 0.1}
    usd: robots/mycobot_280_pi/usd/mycobot_280_pi.usd
    legacy_usd: robots/mycobot_280_pi/usd/legacy/mycobot_280_pi.usd
    source: https://github.com/elephantrobotics/mycobot_ros2

  mycobot_280_gripper:
    description: myCobot 280 with adaptive gripper (M5 meshes)
    camera: {distance: 0.9, target_z: 0.2}   # screenshot framing
    urdf: robots/mycobot_280_gripper/urdf/mycobot_280_gripper.urdf
    fixed_base: true
    mesh_search: [mycobot_280_gripper, mycobot_280_pi]
    defaults: {effort: 5.0, velocity: 2.0, link_mass: 0.1}
    usd: robots/mycobot_280_gripper/usd/mycobot_280_gripper.usd
    legacy_usd: robots/mycobot_280_gripper/usd/legacy/mycobot_step.usd
    source: https://github.com/elephantrobotics/mycobot_ros

  mycomb:
    description: myAGV + myCobot 280 Pi + gripper (lab composite)
    camera: {distance: 1.4, target_z: 0.35}   # screenshot framing
    urdf: robots/mycomb/urdf/mycomb.urdf
    variants: [robots/mycomb/urdf/mycomb1.urdf]
    fixed_base: false
    spawn_z: 0.01
    mesh_search: [myagv, mycobot_280_pi, mycobot_280_gripper]
    defaults: {effort: 5.0, velocity: 2.0, link_mass: 0.1}
    usd: robots/mycomb/usd/mycomb.usd
    source: lab-composed (Xuezhi Niu)

  nova5:
    description: Dobot Nova 5 collaborative arm
    camera: {distance: 1.8, target_z: 0.5}   # screenshot framing
    urdf: robots/nova5/urdf/nova5.urdf
    xacro: robots/nova5/xacro/nova5_robot.xacro
    fixed_base: true
    mesh_search: [nova5]
    # Nova 5 datasheet: max joint speed 180 deg/s; effort is a conservative placeholder.
    defaults: {effort: 150.0, velocity: 3.14, link_mass: 0.1}
    usd: robots/nova5/usd/nova5.usd
    legacy_usd: robots/nova5/usd/legacy/nova5_robot.usd
    source: https://github.com/Dobot-Arm/DOBOT_6Axis_ROS2_V3

  nova5_2f85:
    description: Dobot Nova 5 + Robotiq 2F-85 gripper
    camera: {distance: 1.9, target_z: 0.55}   # screenshot framing
    urdf: robots/nova5_2f85/urdf/nova5_2f85.urdf
    fixed_base: true
    mesh_search: [nova5, robotiq_2f85]
    defaults: {effort: 150.0, velocity: 3.14, link_mass: 0.1}
    usd: robots/nova5_2f85/usd/nova5_2f85.usd
    legacy_usd: robots/nova5_2f85/usd/legacy/nova5_robot_2f85.usd
    source: Dobot + ros-industrial/robotiq, composed by Xuezhi Niu

  robotiq_2f85:
    description: Robotiq 2F-85 gripper (standalone)
    camera: {distance: 0.45, target_z: 0.08}   # screenshot framing
    urdf: robots/robotiq_2f85/urdf/robotiq_2f85.urdf
    fixed_base: true
    mesh_search: [robotiq_2f85]
    defaults: {effort: 1000.0, velocity: 2.0, link_mass: 0.05}
    usd: robots/robotiq_2f85/usd/robotiq_2f85.usd
    source: https://github.com/ros-industrial/robotiq
